# HTTP → HTTPS 跳转
server {
    listen 80;
    server_name www.whclaw.top whclaw.top;

    # 健康检查保持 HTTP 可用（docker healthcheck 用）
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主服务
server {
    listen 443 ssl;
    server_name www.whclaw.top whclaw.top;

    ssl_certificate     /etc/nginx/certs/whclaw.top_bundle.crt;
    ssl_certificate_key /etc/nginx/certs/whclaw.top.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;

    # 启用 gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript;

    # ===== stevenzxs: Typecho 博客 =====
    # ^~ 前缀匹配命中后跳过后面的正则 location，防止静态资源规则拦截
    # proxy_pass 不带 URI：原始路径 /stevenzxs/... 完整转发（保前缀）
    location = /stevenzxs {
        return 301 /stevenzxs/;
    }

    location ^~ /stevenzxs/ {
        proxy_pass http://typecho:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    # ===== stevenzxs end =====

    # 处理前端路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 缓存静态资源
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 健康检查
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
